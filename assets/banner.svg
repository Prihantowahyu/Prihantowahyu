<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="Wahyu Prihanto, Guru TKJ, MikroTik, Linux Server, Web Developer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="0.6" stop-color="#0f2557"/>
      <stop offset="1" stop-color="#1b3a7a"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.75" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#4DA3FF" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#4DA3FF" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#4DA3FF" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="320" rx="16" fill="url(#bg)"/>
  <rect width="1200" height="320" rx="16" fill="url(#grid)"/>
  <rect width="1200" height="320" rx="16" fill="url(#glow)"/>

  <!-- links -->
  <g stroke="#4DA3FF" stroke-opacity="0.35" stroke-width="1.5" fill="none">
    <path id="l1" d="M760 70 L900 150"/>
    <path id="l2" d="M900 150 L1040 60"/>
    <path id="l3" d="M900 150 L1120 190"/>
    <path id="l4" d="M900 150 L840 260"/>
    <path id="l5" d="M840 260 L1000 270"/>
    <path id="l6" d="M1000 270 L1120 190"/>
    <path id="l7" d="M700 190 L900 150"/>
    <path id="l8" d="M700 190 L840 260"/>
    <path id="l9" d="M760 70 L700 190"/>
    <path id="l10" d="M1040 60 L1120 190"/>
  </g>

  <!-- packets -->
  <g fill="#7CC4FF">
    <circle r="3.5"><animateMotion dur="3s" repeatCount="indefinite"><mpath href="#l1"/></animateMotion></circle>
    <circle r="3.5"><animateMotion dur="3.6s" repeatCount="indefinite" begin="0.4s"><mpath href="#l2"/></animateMotion></circle>
    <circle r="3.5"><animateMotion dur="4.2s" repeatCount="indefinite" begin="0.8s"><mpath href="#l3"/></animateMotion></circle>
    <circle r="3.5"><animateMotion dur="3.2s" repeatCount="indefinite" begin="1.2s"><mpath href="#l4"/></animateMotion></circle>
    <circle r="3.5"><animateMotion dur="3.8s" repeatCount="indefinite" begin="0.2s"><mpath href="#l5"/></animateMotion></circle>
    <circle r="3.5"><animateMotion dur="3.4s" repeatCount="indefinite" begin="1.6s"><mpath href="#l6"/></animateMotion></circle>
    <circle r="3.5"><animateMotion dur="4s" repeatCount="indefinite" begin="0.6s"><mpath href="#l7"/></animateMotion></circle>
    <circle r="3.5"><animateMotion dur="3.3s" repeatCount="indefinite" begin="1s"><mpath href="#l8"/></animateMotion></circle>
    <circle r="3.5"><animateMotion dur="3.9s" repeatCount="indefinite" begin="1.4s"><mpath href="#l9"/></animateMotion></circle>
    <circle r="3.5"><animateMotion dur="3.5s" repeatCount="indefinite" begin="0s"><mpath href="#l10"/></animateMotion></circle>
  </g>

  <!-- nodes -->
  <g fill="#0b1220" stroke="#4DA3FF" stroke-width="2">
    <circle cx="760" cy="70" r="9"/>
    <circle cx="1040" cy="60" r="9"/>
    <circle cx="1120" cy="190" r="9"/>
    <circle cx="1000" cy="270" r="9"/>
    <circle cx="840" cy="260" r="9"/>
    <circle cx="700" cy="190" r="9"/>
  </g>
  <!-- core node (router) -->
  <circle cx="900" cy="150" r="14" fill="#4DA3FF"/>
  <circle cx="900" cy="150" r="14" fill="none" stroke="#4DA3FF" stroke-width="2">
    <animate attributeName="r" values="14;34" dur="2.4s" repeatCount="indefinite"/>
    <animate attributeName="stroke-opacity" values="0.7;0" dur="2.4s" repeatCount="indefinite"/>
  </circle>

  <!-- text -->
  <g font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
    <text x="70" y="78" font-family="'Fira Code', Consolas, 'Courier New', monospace" font-size="16" fill="#4DA3FF">~$ whoami</text>
    <rect x="158" y="64" width="9" height="16" fill="#4DA3FF">
      <animate attributeName="opacity" values="1;0;1" dur="1.1s" repeatCount="indefinite"/>
    </rect>
    <text x="70" y="150" font-size="58" font-weight="700" fill="#FFFFFF">Wahyu Prihanto</text>
    <text x="70" y="196" font-size="22" fill="#8BB9FF">Guru TKJ  •  MikroTik  •  Linux Server  •  Web Developer</text>
    <text x="70" y="240" font-size="16" fill="#9AA7BD">SMK Diponegoro Tumpang, Malang</text>
  </g>
</svg>
