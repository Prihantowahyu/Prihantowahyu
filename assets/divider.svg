<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 24" width="1200" height="24" role="presentation" aria-hidden="true">
  <defs>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4DA3FF" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#4DA3FF" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#4DA3FF" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect x="0" y="11" width="1200" height="2" fill="url(#fade)"/>
  <circle cx="600" cy="12" r="5" fill="#4DA3FF"/>
  <circle cx="600" cy="12" r="5" fill="none" stroke="#4DA3FF" stroke-width="1.5">
    <animate attributeName="r" values="5;12" dur="2.4s" repeatCount="indefinite"/>
    <animate attributeName="stroke-opacity" values="0.8;0" dur="2.4s" repeatCount="indefinite"/>
  </circle>
  <circle r="3" cy="12" fill="#7CC4FF">
    <animate attributeName="cx" values="60;1140" dur="5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.9;1" dur="5s" repeatCount="indefinite"/>
  </circle>
</svg>
